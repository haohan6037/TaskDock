services:
  base-worker:
    build:
      context: ./workers/base-worker
    container_name: openclawbrain-base-worker
    ports:
      - "8811:8811"
    volumes:
      - ./workspaces:/workspaces
    environment:
      - WORKER_NAME=base-worker
      - WORKER_MODEL=none

  doc-worker:
    build:
      context: ./workers/doc-worker
    container_name: openclawbrain-doc-worker
    ports:
      - "8812:8812"
    volumes:
      - ./workspaces:/workspaces
    environment:
      - WORKER_NAME=doc-worker
      - WORKER_MODEL=none

  draw-worker:
    build:
      context: ./workers/draw-worker
    container_name: openclawbrain-draw-worker
    ports:
      - "8817:8817"
    volumes:
      - ./workspaces:/workspaces
    environment:
      - WORKER_NAME=draw-worker
      - WORKER_TYPE=draw
      - WORKER_MODEL=none
      - WORKER_SKILLS=python
