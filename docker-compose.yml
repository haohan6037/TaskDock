services:
  base-worker:
    build:
      context: ./workers/base-worker
    container_name: openclawbrain-base-worker
    ports:
      - "8811:8811"
    volumes:
      - ./workspaces:/workspaces
    environment:
      - WORKER_NAME=base-worker
      - WORKER_MODEL=none

  doc-worker:
    build:
      context: ./workers/doc-worker
    container_name: openclawbrain-doc-worker
    ports:
      - "8812:8812"
    volumes:
      - ./workspaces:/workspaces
    environment:
      - WORKER_NAME=doc-worker
      - WORKER_MODEL=none

  demo-worker:
    build:
      context: ./workers/demo-worker
    container_name: openclawbrain-demo-worker
    ports:
      - "8817:8817"
    volumes:
      - ./workspaces:/workspaces
    environment:
      - WORKER_NAME=demo-worker
      - WORKER_TYPE=demo
      - WORKER_MODEL=none
      - WORKER_SKILLS=python

  validation-worker:
    build:
      context: ./workers/validation-worker
    container_name: openclawbrain-validation-worker
    ports:
      - "8818:8818"
    volumes:
      - ./:/project
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WORKER_NAME=validation-worker
      - WORKER_MODEL=none
      - PROJECT_ROOT=/project
      - WORKER_HOST=host.docker.internal
      - TASK_TIMEOUT_SECONDS=120
